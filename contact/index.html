    <main class="contact-page">
      <section class="contact-section">
        <h1 class="contact-title">Let's Talk</h1>

        <p class="contact-intro">Have a question or want to work together?</p>

        <form
          class="contact-form"
          action="https://formspree.io/f/xrenpvaj"
          method="POST"
        >
          <div class="form-field">
            <label for="name">Name</label>
            <input
              type="text"
              id="name"
              name="name"
              autocomplete="name"
              required
            />
          </div>

          <div class="form-field">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              autocomplete="email"
              required
            />
          </div>

          <div class="form-field">
            <label for="subject">Subject</label>
            <input type="text" id="subject" name="subject" required />
          </div>

          <div class="form-field">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="8" required></textarea>
          </div>

          <button type="submit" class="home-button contact-submit">
            <span>Send</span>
          </button>
        </form>
      </section>

      <div class="social-divider">
        <div class="divider-line"></div>
        <div>
          <a
            class="social-link"
            href="mailto:johndsoko@outlook.com"
            aria-label="Email"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-mail h-6 w-6 social-icon"
              aria-hidden="true"
            >
              <path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7"></path>
              <rect x="2" y="4" width="20" height="16" rx="2"></rect></svg></a
          ><a
            class="social-link"
            href="https://www.linkedin.com/in/john-sokolowski/"
            rel="noreferrer"
            target="_blank"
            aria-label="LinkedIn"
            ><svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"

              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-linkedin h-6 w-6 social-icon"
              aria-hidden="true"
            >

                d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"
              ></path>

              <circle cx="4" cy="4" r="2"></circle></svg></a
          ><a
            class="social-link"
            href="https://github.com/jdsoko"
            rel="noreferrer"
            target="_blank"
            aria-label="GitHub"
            ><svg
              xmlns="http://www.w3.org/2000/svg"

              ></path>
